<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wisely — Budget</title>
  <meta name="description" content="Budget, track and grow your money. Private, offline, yours.">
  <meta name="theme-color" content="#F6F3EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="glass-bg" aria-hidden="true"><i class="gs1"></i><i class="gs2"></i><i class="gs3"></i><i class="gs4"></i></div>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/home"><img src="icon.svg" alt="" width="34" height="34"><span>Wisely</span></a>
      <button class="btn primary block" data-act="add-tx"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add transaction</button>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">Private by design · data stays on this device</div>
    </aside>

    <main class="main">
      <div id="view" class="view"></div>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation"></nav>
    <button class="fab" data-act="add-tx" aria-label="Add transaction"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></button>
  </div>

  <div id="sheet" class="sheet" aria-hidden="true"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="overlay"></div>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
